name: Build Android APK
on:
  push:
    branches: [claude/fitness-progress-tracker-s0xq5q]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Same signing key every build so new versions install over old ones
      - run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: npm run build:web
      - run: sed -i "s/const BUILD=0,/const BUILD=${{ github.run_number }},/" www/index.html
      - run: npx cap add android
      - run: python3 scripts/patch-android.py
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: turnfit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Launch test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash scripts/smoke.sh
      - name: Publish release (used by in-app updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TurnFit.apk
          gh release create "build-${{ github.run_number }}" TurnFit.apk --title "TurnFit build ${{ github.run_number }}" --notes "Automatic build ${{ github.run_number }}" --latest --target "${{ github.sha }}"
